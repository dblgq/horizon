# The Xcode project for a phone build: XcodeGen makes ios/Horizon.xcodeproj from this
# (ios/run-device.sh does; the generated project is not committed). It compiles nothing
# itself: its one build phase builds `horizon-ios` with cargo and puts the program in the
# app, and Xcode signs it with the developer's team (a free Apple ID's Personal Team is
# enough) and makes the provisioning profile.
name: Horizon
options:
  # The Xcode this was checked with: no "update to recommended settings" prompt.
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: $(HORIZON_TEAM)
targets:
  Horizon:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: horizon-ios
        PRODUCT_BUNDLE_IDENTIFIER: dev.dblgq.horizon
        HORIZON_BUNDLE_ID: $(PRODUCT_BUNDLE_IDENTIFIER)
        HORIZON_PLATFORM: iPhoneOS
        HORIZON_PROFILE: fast
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    postCompileScripts:
      - name: Build horizon-ios with cargo
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          set -eu
          cd "$SRCROOT/.."
          # Xcode's own settings would reach cargo's C builds (mimalloc, ring) otherwise.
          unset SDKROOT ARCHS
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          "$HOME/.cargo/bin/cargo" build --profile "$HORIZON_PROFILE" --target aarch64-apple-ios -p horizon-ios
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          # Stamped with SDK 26: winit 0.30 has no UIScene life cycle, which iOS 27 requires
          # of apps built with its SDK (docs/ios.md).
          xcrun vtool -set-build-version ios 17.0 26.0 -replace \
              -output "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" \
              "target/aarch64-apple-ios/$HORIZON_PROFILE/horizon-ios"
